[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bizgo-sdk-comm"
dynamic = ["version"]
description = "Python SDK for the Bizgo Communication API (SMS/LMS/MMS, RCS, Kakao AlimTalk/BrandMessage, Naver TalkTalk)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Infobank" }]
keywords = ["bizgo", "sms", "lms", "mms", "rcs", "kakao", "alimtalk", "messaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.20,<2",
]
dev = [
  "opentelemetry-api>=1.20,<2",
  "opentelemetry-sdk>=1.20,<2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "mypy>=1.10",
  "ruff==0.16.10",  # pinned: scripts/_gen_resources.py formats generated code with it (--check must be reproducible)
  "pyyaml>=6",
  "datamodel-code-generator==0.82.0",
]

[project.urls]
Homepage = "https://github.com/icomm-api/bizgo-sdk-comm-python"
Documentation = "https://developers.bizgo.io/api-sdk/api-reference"
Issues = "https://github.com/icomm-api/bizgo-sdk-comm-python/issues"

[tool.hatch.version]
path = "src/bizgo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bizgo"]

[tool.hatch.build.targets.sdist]
include = ["src/bizgo", "tests", "spec", "examples", "scripts", "README.md", "LICENSE", "CHANGELOG.md", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/bizgo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bizgo.models._generated_request", "bizgo.models._generated_response"]
disable_error_code = ["misc"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/bizgo/models/_generated_*.py", "src/bizgo/_error_codes.py", "src/bizgo/_generated_required_if.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Korean text in strings/docstrings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603", "S607", "E501"]
# generated from the spec: Korean docstrings copied from the API reference are not wrapped
"src/bizgo/resources/_generated.py" = ["E501"]
"src/bizgo/_operations.py" = ["E501"]
"src/bizgo/_generated_webhooks.py" = ["E501"]
