# v* 태그를 push하면 PyPI에 배포합니다. PyPI Trusted Publishing(OIDC)을 쓰므로 저장소에 토큰을 두지 않습니다.
# 사전 설정: PyPI 프로젝트 > Publishing에 이 저장소/워크플로/환경(pypi)을 등록하고,
# GitHub 저장소 Settings > Environments > pypi에 필수 승인자를 지정합니다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 태그와 패키지 버전이 같은지
        run: |
          version=$(python -c "import re;print(re.search(r'\"(.+)\"', open('src/bizgo/_version.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
